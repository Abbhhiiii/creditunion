version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: creditassist-db
    environment:
      POSTGRES_DB: creditassist
      POSTGRES_USER: creditassist
      POSTGRES_PASSWORD: secure_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditassist"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creditassist-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://creditassist:secure_password_change_me@postgres:5432/creditassist
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Frontend (Member Chat)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creditassist-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Dashboard (Staff)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: creditassist-dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: creditassist-network
